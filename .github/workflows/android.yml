name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Giải mã keystore (nếu có secret)
        env:
          KEYSTORE_B64: ${{ secrets.CYANOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cyanote.jks"
            echo "CYANOTE_KEYSTORE=$RUNNER_TEMP/cyanote.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (thử) + AAB (Google Play)
        env:
          CYANOTE_KEYSTORE_PASSWORD: ${{ secrets.CYANOTE_KEYSTORE_PASSWORD }}
          CYANOTE_KEY_ALIAS: ${{ secrets.CYANOTE_KEY_ALIAS }}
          CYANOTE_KEY_PASSWORD: ${{ secrets.CYANOTE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Đổi tên file
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/cyanote-android-test.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/cyanote-android-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: cyanote-android
          path: dist/*

      - name: Đăng lên trang Releases (tải thẳng về điện thoại)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Bản thử mới nhất
          prerelease: true
          files: dist/*
          body: |
            Bản build tự động từ nhánh main.
            • Android: tải **cyanote-android-test.apk** về điện thoại rồi mở để cài (cho phép "Cài ứng dụng không rõ nguồn gốc").
            • iOS: xem các file .ipa / .zip (do workflow iOS đăng lên).
