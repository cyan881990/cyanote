name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Giải mã keystore (nếu có secret)
        env:
          KEYSTORE_B64: ${{ secrets.CYANOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cyanote.jks"
            echo "CYANOTE_KEYSTORE=$RUNNER_TEMP/cyanote.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (thử) + AAB (Google Play)
        env:
          CYANOTE_KEYSTORE_PASSWORD: ${{ secrets.CYANOTE_KEYSTORE_PASSWORD }}
          CYANOTE_KEY_ALIAS: ${{ secrets.CYANOTE_KEY_ALIAS }}
          CYANOTE_KEY_PASSWORD: ${{ secrets.CYANOTE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            bash ../.github/scripts/report-errors.sh "$RUNNER_TEMP/gradle.log" Gradle; exit 1; }

      - name: Đổi tên file
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/cyanote-android-test.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/cyanote-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/cyanote-android-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: cyanote-android
          path: |
            dist/cyanote-android-test.apk
            dist/cyanote-android-release.aab

      - name: Đăng lên trang Releases (tải thẳng về điện thoại)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Bản thử mới nhất
          prerelease: true
          files: |
            dist/cyanote-android-test.apk
            dist/cyanote-android-release.aab
          body: |
            Bản build tự động từ nhánh main.
            • Android: tải **cyanote-android-test.apk** về điện thoại rồi mở để cài (cho phép "Cài ứng dụng không rõ nguồn gốc").
            • iOS: xem các file .ipa / .zip (do workflow iOS đăng lên).

      - uses: actions/upload-artifact@v4
        with:
          name: site-android
          path: dist/cyanote-android.apk

  # ---- Tự cập nhật: đưa bản mới lên trang web công khai + cập nhật update.json ----
  # Cần secret SITE_DEPLOY_TOKEN (token có quyền ghi kho cyan881990.github.io). Không có thì bỏ qua.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: site-publish
      cancel-in-progress: false
    env:
      SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SITE_DEPLOY_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.SITE_DEPLOY_TOKEN != ''
        with:
          name: site-android
          path: incoming
      - name: Đẩy lên kho trang web (chỉ giữ bản mới nhất)
        if: env.SITE_DEPLOY_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/cyan881990/cyan881990.github.io" site
          mkdir -p site/download
          cp incoming/cyanote-android.apk site/download/cyanote-android.apk
          python3 tools/publish_update.py site android ${{ github.run_number }}
          cd site
          git config user.name "cyanote-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "Android build ${{ github.run_number }}"
          git push --force origin fresh:main
