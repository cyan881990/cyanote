name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen và sinh dự án Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build cho máy ảo iOS (Simulator)
        run: |
          set +e
          xcodebuild -project Cyanote.xcodeproj -scheme Cyanote -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build-sim.log 2>&1
          code=$?
          ../.github/scripts/report-errors.sh build-sim.log "Simulator"
          exit $code

      - name: Build cho iPhone (chưa ký)
        run: |
          set +e
          xcodebuild -project Cyanote.xcodeproj -scheme Cyanote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build-device.log 2>&1
          code=$?
          ../.github/scripts/report-errors.sh build-device.log "iPhone"
          exit $code

      - name: Đóng gói .ipa (chưa ký) và bản Simulator
        run: |
          mkdir -p ../dist Payload
          cp -R build/Build/Products/Release-iphoneos/Cyanote.app Payload/
          zip -qr ../dist/cyanote-ios-unsigned.ipa Payload
          (cd build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../../dist/cyanote-ios-simulator.zip Cyanote.app)
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: cyanote-ios
          path: dist/*

      - name: Đăng lên trang Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Bản thử mới nhất
          prerelease: true
          files: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: site-ios
          path: dist/cyanote-ios-unsigned.ipa

  # ---- Tự cập nhật: đưa bản mới lên trang web công khai + cập nhật update.json ----
  # Cần secret SITE_DEPLOY_TOKEN (token có quyền ghi kho cyan881990.github.io). Không có thì bỏ qua.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: site-publish
      cancel-in-progress: false
    env:
      SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SITE_DEPLOY_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.SITE_DEPLOY_TOKEN != ''
        with:
          name: site-ios
          path: incoming
      - name: Đẩy lên kho trang web (chỉ giữ bản mới nhất)
        if: env.SITE_DEPLOY_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/cyan881990/cyan881990.github.io" site
          mkdir -p site/download
          cp incoming/cyanote-ios-unsigned.ipa site/download/cyanote-ios-unsigned.ipa
          python3 tools/publish_update.py site ios ${{ github.run_number }}
          cd site
          git config user.name "cyanote-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "iOS build ${{ github.run_number }}"
          git push --force origin fresh:main
